# Render Blueprint: builds the Dockerfile from GitHub and provisions PostgreSQL.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: pageturner-bookstore
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: pageturner-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pageturner-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pageturner-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pageturner-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pageturner-db
          property: password

databases:
  - name: pageturner-db
    plan: free
    databaseName: bookstore
