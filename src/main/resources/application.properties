spring.application.name=bookstore-backend
server.port=${PORT:8080}

# H2 in-memory by default; use --spring.profiles.active=postgres for PostgreSQL
spring.datasource.url=jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consistent error payloads, no stack traces leaked
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator: only expose what is needed for health probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
